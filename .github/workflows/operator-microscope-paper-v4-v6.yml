name: Operator and Yoann Trader microscope V4-V6 PAPER
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/agent_crypto_erith_ia/administrator/index.html'
      - 'public/agent_crypto_erith_ia/administrator/js/market-microscope-*.js'
      - 'public/agent_crypto_erith_ia/administrator/tests/test-market-microscope-*.cjs'
      - '.github/workflows/operator-microscope-paper-v4-v6.yml'
  push:
    branches: [main, integrate/operator-microscope-v4-v6-20261106]
    paths:
      - 'public/agent_crypto_erith_ia/administrator/index.html'
      - 'public/agent_crypto_erith_ia/administrator/js/market-microscope-*.js'
      - 'public/agent_crypto_erith_ia/administrator/tests/test-market-microscope-*.cjs'
      - '.github/workflows/operator-microscope-paper-v4-v6.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paper-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and Operator/Trader shared runtime contract
        run: |
          node --check public/agent_crypto_erith_ia/administrator/js/market-microscope-candles.js
          node --check public/agent_crypto_erith_ia/administrator/js/market-microscope-strategy-options.js
          node --check public/agent_crypto_erith_ia/administrator/js/market-microscope-paper-backtest-v5.js
          node --check public/agent_crypto_erith_ia/administrator/js/market-microscope-orderbook-paper-v6.js
          node public/agent_crypto_erith_ia/administrator/tests/test-operator-market-microscope-wiring.cjs
      - name: V5 historical PAPER 13 cases
        run: node public/agent_crypto_erith_ia/administrator/tests/test-market-microscope-paper-backtest-v5.cjs
      - name: V6 instant OKX book PAPER 31 cases
        run: node public/agent_crypto_erith_ia/administrator/tests/test-market-microscope-orderbook-paper-v6.cjs
