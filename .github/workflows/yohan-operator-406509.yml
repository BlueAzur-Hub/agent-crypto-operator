name: Yohan Operator 40.6.509 + Control Center R19Y1

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Operator / R19Y1 Control Center contract
        run: python .github/scripts/yohan_operator_406509_guard.py
      - name: Validate JavaScript layers
        run: |
          node --check public/agent_crypto_erith_ia/administrator/js/yohan-operator-profile.js
          node --check public/agent_crypto_erith_ia/administrator/js/yohan-operator-bridge-client.js
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/graph-native-usd-406520.js
          node --check public/agent_crypto_erith_ia/administrator/js/market-microscope-candles.js
          node --check public/agent_crypto_erith_ia/administrator/js/okx-public-chart-history.js
          node --check public/agent_crypto_erith_ia/administrator/js/verified-periods-reader.js
          node --check public/agent_crypto_erith_ia/administrator/js/new-listings-native-category.js
          node --check public/agent_crypto_erith_ia/administrator/js/okx-microstructure-406499.js
          node --check public/agent_crypto_erith_ia/administrator/js/learning-lab.js
          node --check public/agent_crypto_erith_ia/administrator/js/market-radar-native.js
          node --check public/agent_crypto_erith_ia/administrator/js/top250-history-catalog.js
          node --check public/agent_crypto_erith_ia/administrator/js/shared-historical-view.js
          node --check public/agent_crypto_erith_ia/administrator/js/shared-hourly-history.js
          node --check public/agent_crypto_erith_ia/administrator/js/btc-annual-view.js
          node --check public/agent_crypto_erith_ia/administrator/js/historical-archive-adapter.js
          node --check public/agent_crypto_erith_ia/administrator/js/historical-btc-comparator.js
          node --check public/agent_crypto_erith_ia/administrator/js/historical-compact-reader.js
          node --check public/agent_crypto_erith_ia/administrator/js/historical-yearly-browser.js
      - name: Verify Phase B read-only Market and Scanner compatibility
        run: node --test .github/scripts/operator_phase_b_compat.test.cjs
      - name: Verify canonical Radar native and standalone behavior
        run: |
          node --test public/agent_crypto_erith_ia/administrator/js/test-market-radar-fidelity.cjs
          node public/agent_crypto_erith_ia/laboratoire/test-radar.cjs
