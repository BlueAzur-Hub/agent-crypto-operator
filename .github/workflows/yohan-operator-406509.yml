name: Yohan Operator 40.6.509 + Control Center R19Y1

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Operator / R19Y1 Control Center contract
        run: python .github/scripts/yohan_operator_406509_guard.py
      - name: Validate JavaScript layers
        run: |
          node --check public/agent_crypto_erith_ia/administrator/js/yohan-operator-profile.js
          node --check public/agent_crypto_erith_ia/administrator/js/yohan-operator-bridge-client.js
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --check public/agent_crypto_erith_ia/administrator/js/graph-native-usd-406520.js
          node --check public/agent_crypto_erith_ia/administrator/js/market-microscope-candles.js
          node --check public/agent_crypto_erith_ia/administrator/js/okx-public-chart-history.js
          node --check public/agent_crypto_erith_ia/administrator/js/verified-periods-reader.js
      - name: Verify Phase B read-only Market and Scanner compatibility
        run: node --test .github/scripts/operator_phase_b_compat.test.cjs
