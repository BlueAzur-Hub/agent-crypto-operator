name: Operator scanner 84 read-only acceptance matrix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/operator_scanner_84_acceptance.py"
      - ".github/workflows/operator_scanner_84_acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanner-84:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify read-only audit script syntax
        run: python -m py_compile .github/scripts/operator_scanner_84_acceptance.py
      - name: Confirm source baseline and scanner regression
        run: |
          node --check public/agent_crypto_erith_ia/administrator/app.js
          node --test public/agent_crypto_erith_ia/tools/test_scanner_full_window.cjs
          node --test public/agent_crypto_erith_ia/tools/test_scanner_native_usd_reuse.cjs
          node --test public/agent_crypto_erith_ia/tools/test_operator_history_quote_cache.test.cjs
      - name: Install Firefox automation
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps firefox
      - name: Execute 84 real UI combinations with public read-only sources
        run: python .github/scripts/operator_scanner_84_acceptance.py
      - name: Upload complete per-case evidence, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-scanner-84-readonly-evidence
          path: operator_scanner_84_evidence/
          retention-days: 30
          if-no-files-found: warn
