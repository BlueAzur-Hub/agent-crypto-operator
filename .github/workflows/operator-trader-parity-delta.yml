name: Verify Operator Trader parity and six-file differential

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/operator-trader-parity-delta.yml"
      - "public/agent_crypto_erith_ia/administrator/index.html"
      - "public/agent_crypto_erith_ia/administrator/build.json"
      - "public/agent_crypto_erith_ia/administrator/js/graph-native-usd.js"
      - "public/agent_crypto_erith_ia/trader/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/operator-trader-parity-delta.yml"
      - "public/agent_crypto_erith_ia/administrator/index.html"
      - "public/agent_crypto_erith_ia/administrator/build.json"
      - "public/agent_crypto_erith_ia/administrator/js/graph-native-usd.js"
      - "public/agent_crypto_erith_ia/trader/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /public/agent_crypto_erith_ia/administrator/app.js
            /public/agent_crypto_erith_ia/administrator/index.html
            /public/agent_crypto_erith_ia/administrator/build.json
            /public/agent_crypto_erith_ia/administrator/js/graph-native-usd.js
            /public/agent_crypto_erith_ia/trader/build.json
            /public/agent_crypto_erith_ia/trader/trading-desk.html
            /public/agent_crypto_erith_ia/trader/trader-runtime-mirror.js
            /public/agent_crypto_erith_ia/trader/strategy-comparator.js
            /public/agent_crypto_erith_ia/trader/spot-paper-order-engine.js
            /public/agent_crypto_erith_ia/trader/trader-paper-decision-core.js
            /public/agent_crypto_erith_ia/trader/trader-paper-decision-view.js
            /public/agent_crypto_erith_ia/trader/trader-order-entry-view.js
            /public/agent_crypto_erith_ia/trader/trader-order-entry.css
            /public/agent_crypto_erith_ia/trader/trader-paper-lab-core.js
            /public/agent_crypto_erith_ia/trader/trader-paper-lab-view.js
            /public/agent_crypto_erith_ia/trader/test-master-public-parity.cjs
            /public/agent_crypto_erith_ia/web/vault-data-router.js
            /public/agent_crypto_erith_ia/trader/technical-reading-data-sync.js
            /public/agent_crypto_erith_ia/trader/ai-asset-reading-core.js
            /public/agent_crypto_erith_ia/trader/ai-asset-reading-view.js
            /public/agent_crypto_erith_ia/trader/ai-asset-reading.css
            /public/agent_crypto_erith_ia/trader/market-fiche-native.js
            /public/agent_crypto_erith_ia/administrator/data/new-listings-identities.json
            /public/agent_crypto_erith_ia/administrator/assets/crypto/new-listings/axis-robotics.svg
            /public/agent_crypto_erith_ia/trader/ai-ct-contract.js
            /.github/workflows/operator-trader-parity-delta.yml
      - name: Validate JavaScript syntax and native USD source
        run: |
          set -euo pipefail
          node --check public/agent_crypto_erith_ia/administrator/js/graph-native-usd.js
          node --check public/agent_crypto_erith_ia/trader/trader-runtime-mirror.js
          for file in \
            strategy-comparator.js spot-paper-order-engine.js \
            trader-paper-decision-core.js trader-paper-decision-view.js \
            trader-order-entry-view.js trader-paper-lab-core.js trader-paper-lab-view.js; do
            node --check "public/agent_crypto_erith_ia/trader/$file"
          done
          node --check public/agent_crypto_erith_ia/web/vault-data-router.js
          node --test public/agent_crypto_erith_ia/trader/test-master-public-parity.cjs
          node --check public/agent_crypto_erith_ia/trader/technical-reading-data-sync.js
          node - <<'NODE'
          const assert=require('node:assert/strict');
          require('./public/agent_crypto_erith_ia/administrator/js/graph-native-usd.js');
          const api=globalThis.AgentCryptoGraphNativeUsd;
          const test=api?.self_test?.();
          assert.equal(test?.pass,true,JSON.stringify(test?.checks));
          assert.equal(test.checks.top5_stale_usd_refused,true);
          assert.equal(test.checks.top5_missing_change_refused,true);
          assert.equal(api.real_order,false);
          console.log('CANONICAL_USD_OWNER_PASS');
          NODE
      - name: Verify role boundary and exact incremental package
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,zipfile
          root=pathlib.Path("public/agent_crypto_erith_ia")
          index=(root/"administrator/index.html").read_text()
          mirror=(root/"trader/trader-runtime-mirror.js").read_text()
          desk=(root/"trader/trading-desk.html").read_text()
          trader=json.loads((root/"trader/build.json").read_text())
          admin=json.loads((root/"administrator/build.json").read_text())
          assert index.count("./js/graph-native-usd.js?v=")==1
          assert "./js/graph-native-usd-406520.js?v=" not in index
          assert mirror.count('script.id="traderTechnicalReadingSyncScript"')==1
          for marker in ("technical-reading-data-sync.js","yohan-operator-profile.js","yohan-operator-bridge-client.js","real_orders:false"):
            assert marker in mirror,marker
          assert "surface=trader&amp;view=intermediate&amp;profile=yohan" in desk
          assert trader["build"]=="40.6.719" and trader["administrator_base"]=="40.6.719"
          assert trader["market_core"]=="38.15.11"
          assert trader["execution"]=="disabled" and trader["real_orders"] is False
          assert "administrator/js/graph-native-usd.js" in json.dumps(trader)
          assert "js/graph-native-usd.js" in json.dumps(admin)
          rootpaths=[
            "public/agent_crypto_erith_ia/administrator/index.html",
            "public/agent_crypto_erith_ia/administrator/build.json",
            "public/agent_crypto_erith_ia/administrator/js/graph-native-usd.js",
            "public/agent_crypto_erith_ia/trader/build.json",
            "public/agent_crypto_erith_ia/trader/trader-runtime-mirror.js",
            "public/agent_crypto_erith_ia/trader/trading-desk.html"
          ]
          base=os.environ["BASE_SHA"]
          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          modified=subprocess.check_output(["git","diff","--name-only","--diff-filter=ACMRT",base,head,"--","public/agent_crypto_erith_ia/"],text=True).splitlines()
          modified=[p for p in modified if not (p.endswith(".test.mjs") or p.endswith(".test.js") or p.endswith(".test.cjs") or pathlib.Path(p).name.startswith("test-") or pathlib.Path(p).name.startswith("test_"))]
          deleted=subprocess.check_output(["git","diff","--name-only","--diff-filter=D",base,head,"--","public/agent_crypto_erith_ia/"],text=True).strip()
          assert not deleted,deleted
          canonical=subprocess.check_output(["git","hash-object","public/agent_crypto_erith_ia/administrator/js/graph-native-usd.js"],text=True).strip()
          assert canonical=="aa2bbdc4f6473c949a1864b13c077fb63e694281",canonical
          # Dedicated shared microscope migration: 5 application files, never
          # pretend it is the historical six-file Trader delivery. The separate
          # V4-V6 workflow owns syntax, deterministic maths and UI wiring.
          microscope_paths=[
            "public/agent_crypto_erith_ia/administrator/index.html",
            "public/agent_crypto_erith_ia/administrator/js/market-microscope-candles.js",
            "public/agent_crypto_erith_ia/administrator/js/market-microscope-strategy-options.js",
            "public/agent_crypto_erith_ia/administrator/js/market-microscope-paper-backtest-v5.js",
            "public/agent_crypto_erith_ia/administrator/js/market-microscope-orderbook-paper-v6.js"
          ]
          if sorted(modified)==sorted(microscope_paths):
            expected={
              "market-microscope-candles.js":"c07c9e78dba9d081832991ce71e8796cf22e6add",
              "market-microscope-strategy-options.js":"b862de85562cab4873f2d46a099a62db1da93204",
              "market-microscope-paper-backtest-v5.js":"70b3807ba635e58776333c563ac0bda7452b1dee",
              "market-microscope-orderbook-paper-v6.js":"7ae813cd1268ddd657052cc1e2ca474e8b1aed3b",
            }
            for name,sha in expected.items():
              path=root/"administrator/js"/name
              assert subprocess.check_output(["git","hash-object",str(path)],text=True).strip()==sha,name
              assert index.count("./js/"+name)==1,name
            assert "operator-microscope-ema-v4-20261106" in index
            assert "TECH_PANEL_UNAVAILABLE" in (root/"administrator/js/market-microscope-orderbook-paper-v6.js").read_text()
            assert trader["real_orders"] is False
            print("OPERATOR_SHARED_MICROSCOPE_V4_V5_V6_SCOPE_PASS; tests owned by dedicated workflow and Firefox Phase C")
            raise SystemExit(0)
          # Preserve the exact historic six-file parity release contract.
          # New TRADUS-only candidates are checked here but packaged solely by
          # the Operator Phase C Firefox differential workflow (one ZIP owner).
          tradus_paths=[
            "public/agent_crypto_erith_ia/trader/build.json",
            "public/agent_crypto_erith_ia/trader/trader-runtime-mirror.js",
            "public/agent_crypto_erith_ia/trader/trader-tradus-readonly.js",
            "public/agent_crypto_erith_ia/trader/trading-desk.html"
          ]
          if sorted(modified)==sorted(tradus_paths):
            assert 'tradus.id="traderTradusReadOnlyScript"' in mirror
            assert "trader-tradus-readonly.js" in mirror
            assert trader.get("tradus_trader_candidate",{}).get("real_orders") is False
            assert trader.get("tradus_trader_candidate",{}).get("status")=="CANDIDATE_NOT_PUBLISHED"
            print("OPERATOR_TRADUS_PARITY_GUARD_PASS; ZIP owned by Phase C")
            raise SystemExit(0)
          # A separate, explicit seven-dossier delta: preserve the historic
          # six-file/Tradus parity contracts and forbid all Administrator mutations.
          seven_paths=[
            "public/agent_crypto_erith_ia/trader/ai-asset-reading-core.js",
            "public/agent_crypto_erith_ia/trader/ai-asset-reading-view.js",
            "public/agent_crypto_erith_ia/trader/ai-asset-reading.css",
            "public/agent_crypto_erith_ia/trader/technical-reading-data-sync.js",
            "public/agent_crypto_erith_ia/trader/ai-ct-contract.js",
            "public/agent_crypto_erith_ia/trader/trader-runtime-mirror.js"
          ]
          if sorted(modified)==sorted(seven_paths):
            sync=(root/"trader/technical-reading-data-sync.js").read_text()
            view=(root/"trader/ai-asset-reading-view.js").read_text()
            contract=(root/"trader/ai-ct-contract.js").read_text()
            assert "mountSevenDossier()" in sync
            assert "traderSevenAssetCoreScript" in sync and "traderSevenAssetViewScript" in sync
            assert "privateAllowed()" in view and "privateButton.disabled=busy||!isNativeOkx||!privateAllowed();" in view
            assert "remainingFor,acquisitionFor" in contract
            assert "spotBookEstimateFor,spotTradingRulesFor" in contract
            assert "operator-trader-default-usd" in mirror
            assert "operator-trader-usd-redraw" in mirror
            assert "agent-crypto:quote-architecture-changed" in mirror
            assert "real_orders:false" in mirror
            print("OPERATOR_SEVEN_DOSSIER_USD_DELTA_GUARD_PASS; ZIP owned by Phase C")
            raise SystemExit(0)
          # Narrow, audited read-only market fact + static logo/identity patch.
          # Never treat missing cap or unverified external zeros as measured values.
          facts_paths=[
            "public/agent_crypto_erith_ia/trader/market-fiche-native.js",
            "public/agent_crypto_erith_ia/administrator/data/new-listings-identities.json"
          ]
          if sorted(modified)==sorted(facts_paths):
            import json
            fiche=(root/"trader/market-fiche-native.js").read_text()
            identities=json.loads((root/"administrator/data/new-listings-identities.json").read_text())["identities"]
            assert "const cap=capRaw!==null&&capRaw>0?capRaw:null;" in fiche
            assert "const externalMissing=v=>c?.radarSource&&finite(v)===0?null:v;" in fiche
            assert identities["axis-robotics"]["spotUsdcOkxVerified"] is False
            assert identities["axis-robotics"]["okxDerivativesNotSpot"] is True
            assert identities["neosoul"]["verifiedAt"]=="2026-10-25"
            assert (root/"administrator/assets/crypto/new-listings/axis-robotics.svg").exists()
            print("OPERATOR_VERIFIED_MARKET_FACTS_AND_IDENTITY_PARITY_PASS; ZIP owned by Phase C")
            raise SystemExit(0)
          # Currency-board parity changes use the shared Administrator runtime,
          # not the historical six-file Trader delivery. Keep the six-file
          # assertion intact below, and let Phase C own the new differential.
          chart_quote_paths=[
            "public/agent_crypto_erith_ia/administrator/app.js",
            "public/agent_crypto_erith_ia/administrator/index.html"
          ]
          if sorted(modified)==sorted(chart_quote_paths):
            assert "operator-chart-quote-parity" in index
            assert "38.15.11" in json.dumps(trader)
            assert trader["real_orders"] is False
            print("OPERATOR_CHART_CURRENCY_PARITY_SCOPE_PASS; ZIP owned by Phase C")
            raise SystemExit(0)
          # Whole, source-identical MASTER public PAPER readers plus the preserved
          # Operator-specific TRADUS handoff. No historical six-file overwrite.
          public_paper_paths=[
            "public/agent_crypto_erith_ia/trader/strategy-comparator.js",
            "public/agent_crypto_erith_ia/trader/spot-paper-order-engine.js",
            "public/agent_crypto_erith_ia/trader/trader-paper-decision-core.js",
            "public/agent_crypto_erith_ia/trader/trader-paper-decision-view.js",
            "public/agent_crypto_erith_ia/trader/trader-order-entry-view.js",
            "public/agent_crypto_erith_ia/trader/trader-order-entry.css",
            "public/agent_crypto_erith_ia/trader/trader-paper-lab-core.js",
            "public/agent_crypto_erith_ia/trader/trader-paper-lab-view.js",
            "public/agent_crypto_erith_ia/trader/trader-runtime-mirror.js"
          ]
          # Shared scanner runtime migrates once for both Operator and Trader.
          # Require the exact pinned functional transplant plus PAPER scope.
          integrated_scanner_paths=public_paper_paths+[
            "public/agent_crypto_erith_ia/administrator/app.js"
          ]
          if sorted(modified)==sorted(integrated_scanner_paths):
            scanner_blob=subprocess.check_output([
                "git","hash-object",
                "public/agent_crypto_erith_ia/administrator/app.js"
              ],text=True).strip()
            assert scanner_blob=="477c53766a0f412e59a99cf556c65928f4c51b08",scanner_blob
            assert "mountPublicPaper();" in mirror
            assert "trader-tradus-readonly.js" in mirror
            assert trader["real_orders"] is False
            print("OPERATOR_MASTER_SCANNER_AND_TRADER_DATA_PARITY_PASS; ZIP owned by Phase C")
            raise SystemExit(0)
          if sorted(modified)==sorted(public_paper_paths):
            assert 'mountPublicPaper();' in mirror
            assert 'trader-tradus-readonly.js' in mirror
            assert 'trader-order-entry.css' in mirror
            assert 'real_orders:false' in mirror
            assert trader["real_orders"] is False
            print("OPERATOR_CANONICAL_PUBLIC_PAPER_DATA_PARITY_PASS; ZIP owned by Phase C")
            raise SystemExit(0)
          assert sorted(modified)==sorted(rootpaths),(modified,rootpaths)
          folder=pathlib.Path("operator_trader_delta")
          folder.mkdir(exist_ok=True)
          name="AGENT_CRYPTO_OPERATOR_YOANN_TRADER_MARKET_USD_TECHNICAL_SYNC_40_6_719_INCREMENTAL_UPDATE_2026_11_03.zip"
          dest=folder/name
          with zipfile.ZipFile(dest,"w",zipfile.ZIP_DEFLATED,compresslevel=9) as out:
            for path in rootpaths:out.write(path,path)
          with zipfile.ZipFile(dest) as out:
            assert out.testzip() is None
            assert set(out.namelist())==set(rootpaths)
            for path in rootpaths:assert out.read(path)==pathlib.Path(path).read_bytes()
          assert dest.stat().st_size<20*1024*1024
          digest=hashlib.sha256(dest.read_bytes()).hexdigest()
          (folder/(name+".sha256")).write_text(digest+"  "+name+"\n")
          (folder/"SOURCE_COMMIT.txt").write_text(head+"\n")
          (folder/"BASE_COMMIT.txt").write_text(base+"\n")
          (folder/"FILES_CHANGED.txt").write_text("\n".join(rootpaths)+"\n")
          (folder/"FILES_SHA256.txt").write_text("\n".join(hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()+"  "+p for p in rootpaths)+"\n")
          (folder/"READ_ME_FIRST.txt").write_text("Six changed public application files only, not a full GitHub package. Operator profile and private Bridge unchanged; no real orders. Firefox Windows remains a user verification.\n")
          print("OPERATOR_TRADER_SIX_FILE_DELTA_PASS",head,dest.stat().st_size,digest)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: operator-trader-406719-six-file-incremental-zip
          path: operator_trader_delta/
          retention-days: 14
          if-no-files-found: warn
